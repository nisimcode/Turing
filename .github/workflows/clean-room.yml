name: Clean-room package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-room-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: false

      - name: Build source and wheel packages
        run: uv build --no-sources

      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: >-
          uvx --from ./dist/turing_gate-0.2.0-py3-none-any.whl
          turing-gate install-browser --with-deps

      - name: Install Chromium
        if: runner.os == 'Windows'
        run: >-
          uvx --from ./dist/turing_gate-0.2.0-py3-none-any.whl
          turing-gate install-browser

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libegl1 libxcb-cursor0 libxkbcommon-x11-0

      - name: Diagnose the clean environment
        run: >-
          uvx --from ./dist/turing_gate-0.2.0-py3-none-any.whl
          turing-gate doctor --json

      - name: Diagnose the optional GUI from the wheel
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          uvx --from ./dist/turing_gate-0.2.0-py3-none-any.whl
          --with "PySide6-Essentials>=6.7,<7"
          turing-gate ui --check .

      - name: Catch all bundled defects
        run: >-
          uvx --from ./dist/turing_gate-0.2.0-py3-none-any.whl
          turing-gate demo

      - name: Create a functional starter manifest
        run: >-
          uvx --from ./dist/turing_gate-0.2.0-py3-none-any.whl
          turing-gate init examples/shipping/shipping.html
          --output examples/shipping/ci-turing.json
          --hook window.__turing.calculateShipping
          --domain-schema '{"args":[{"type":"number","minimum":0}]}'
          --case '{"label":"threshold","args":[100],"expected":0}'

      - name: Accept the generated user manifest
        run: >-
          uvx --from ./dist/turing_gate-0.2.0-py3-none-any.whl
          turing-gate verify examples/shipping/ci-turing.json --json

      - name: Accept the passing user example
        run: >-
          uvx --from ./dist/turing_gate-0.2.0-py3-none-any.whl
          turing-gate verify examples/shipping/turing.json --json

      - name: Exercise the optional owner GUI headlessly
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --frozen --extra gui python gate/offline_gui_check.py

      - name: Measure the paired logic-tool benchmark
        run: uv run --frozen python gate/offline_benchmark_check.py --json

      - name: Challenge cases with independently validated mechanical faults
        run: >-
          uv run --frozen python gate/offline_benchmark_mutation_check.py
          --json --require-perfect
