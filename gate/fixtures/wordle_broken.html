<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wordle</title>
<style>
  body { font-family: sans-serif; background:#121213; color:#fff; text-align:center; }
  h1 { background:#538d4e; padding:10px; margin:0; letter-spacing:2px; }
  .tile { display:inline-block; width:44px; height:44px; border:2px solid #3a3a3c;
          margin:3px; vertical-align:top; }
  input { padding:6px; margin-top:12px; text-transform:uppercase; }
  button { padding:6px 12px; }
</style>
</head>
<body>
  <h1>WORDLE</h1>
  <div id="board">
    <div class="tile"></div><div class="tile"></div><div class="tile"></div>
    <div class="tile"></div><div class="tile"></div>
  </div>
  <input id="g" maxlength="5" placeholder="guess">
  <button id="go">Guess</button>
  <script>
    // BUGGY: naive one-pass, marks 'Y' whenever the letter is anywhere in the
    // answer -- ignores letter counts, so duplicates are mis-colored.
    window.__wordle = {
      _answer: "CRANE",
      setAnswer(w) { this._answer = w.toUpperCase(); },
      guess(g) {
        g = g.toUpperCase();
        const a = this._answer;
        let res = '';
        for (let i = 0; i < 5; i++) {
          if (g[i] === a[i]) res += 'G';
          else if (a.includes(g[i])) res += 'Y';
          else res += 'B';
        }
        return res;
      }
    };
    document.getElementById('go').onclick = () => {
      document.title = window.__wordle.guess(document.getElementById('g').value);
    };
  </script>
</body>
</html>
